<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#6c5ce7">
<title>Vynza - Sosyal Platform</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --primary:#6c5ce7;
    --primary2:#5848d8;
    --bg:#f5f6fa;
    --card:#fff;
    --text:#17171c;
    --muted:#777b87;
    --border:#e5e6eb;
    --hover:#f0efff;
    --danger:#ef476f;
}

body.dark{
    --bg:#0d0e12;
    --card:#17181e;
    --text:#fff;
    --muted:#9b9da8;
    --border:#292b33;
    --hover:#242130;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* AUTH */

.auth{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at top left,#6c5ce733,transparent 35%),
        radial-gradient(circle at bottom right,#a29bfe33,transparent 35%),
        var(--bg);
}

.auth-box{
    width:100%;
    max-width:430px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:30px;
    box-shadow:0 20px 60px #00000015;
}

.auth-logo{
    text-align:center;
    font-size:38px;
    font-weight:900;
    color:var(--primary);
    margin-bottom:7px;
}

.auth-sub{
    text-align:center;
    color:var(--muted);
    margin-bottom:25px;
}

.auth-tabs{
    display:flex;
    background:var(--bg);
    border-radius:12px;
    padding:4px;
    margin-bottom:20px;
}

.auth-tabs button{
    flex:1;
    border:0;
    padding:11px;
    border-radius:9px;
    background:transparent;
    color:var(--muted);
    font-weight:700;
}

.auth-tabs button.active{
    background:var(--primary);
    color:#fff;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    padding:13px;
    border:1px solid var(--border);
    border-radius:11px;
    background:var(--bg);
    color:var(--text);
    outline:none;
}

textarea{
    resize:vertical;
    min-height:100px;
}

input:focus,
textarea:focus{
    border-color:var(--primary);
}

.primary-btn{
    width:100%;
    padding:13px;
    border:0;
    border-radius:11px;
    background:var(--primary);
    color:white;
    font-weight:800;
    font-size:15px;
}

.primary-btn:hover{
    background:var(--primary2);
}

.error{
    display:none;
    color:var(--danger);
    background:#ef476f12;
    padding:10px;
    border-radius:9px;
    font-size:13px;
    margin-bottom:14px;
}

/* APP */

#app{
    display:none;
}

header{
    height:64px;
    position:sticky;
    top:0;
    z-index:100;
    background:var(--card);
    border-bottom:1px solid var(--border);
}

.header-inner{
    height:100%;
    max-width:1200px;
    margin:auto;
    padding:0 15px;
    display:flex;
    align-items:center;
    gap:20px;
}

.logo{
    font-size:26px;
    font-weight:900;
    color:var(--primary);
}

.search{
    flex:1;
    max-width:420px;
    position:relative;
}

.search input{
    width:100%;
    border-radius:22px;
    padding:10px 16px;
}

.header-actions{
    margin-left:auto;
    display:flex;
    gap:5px;
}

.icon-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:transparent;
    color:var(--text);
    font-size:18px;
}

.icon-btn:hover{
    background:var(--hover);
}

/* SEARCH RESULTS */

.search-results{
    position:absolute;
    top:48px;
    left:0;
    right:0;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:7px;
    display:none;
    box-shadow:0 15px 40px #0002;
    z-index:200;
}

.search-user{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
}

.search-user:hover{
    background:var(--hover);
}

.search-user img{
    width:38px;
    height:38px;
    border-radius:50%;
    object-fit:cover;
}

/* LAYOUT */

.container{
    max-width:1200px;
    margin:22px auto;
    padding:0 15px;
    display:grid;
    grid-template-columns:250px minmax(0,650px) 250px;
    gap:20px;
}

/* LEFT */

.sidebar{
    position:sticky;
    top:85px;
    align-self:start;
}

.profile-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    text-align:center;
}

.avatar{
    width:95px;
    height:95px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid var(--primary);
    background:#ddd;
}

.profile-name{
    font-size:18px;
    font-weight:800;
    margin-top:10px;
}

.profile-username{
    color:var(--muted);
    font-size:13px;
    margin-top:3px;
}

.bio{
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
    margin-top:9px;
}

.stats{
    display:flex;
    justify-content:space-around;
    margin:18px 0;
}

.stat strong{
    display:block;
}

.stat span{
    color:var(--muted);
    font-size:11px;
}

.btn{
    border:0;
    padding:10px 14px;
    border-radius:10px;
    background:var(--primary);
    color:#fff;
    font-weight:700;
}

.btn:hover{
    background:var(--primary2);
}

.full{
    width:100%;
}

.nav{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    margin-top:15px;
    padding:8px;
}

.nav button{
    width:100%;
    border:0;
    background:transparent;
    color:var(--text);
    padding:12px;
    text-align:left;
    border-radius:10px;
    font-weight:700;
}

.nav button:hover,
.nav button.active{
    background:var(--hover);
    color:var(--primary);
}

/* CENTER */

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    margin-bottom:17px;
}

.create-title{
    font-weight:800;
    margin-bottom:12px;
}

.create-bottom{
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.image-label{
    background:var(--bg);
    border:1px solid var(--border);
    padding:9px 12px;
    border-radius:10px;
    cursor:pointer;
    font-size:13px;
}

.image-label input{
    display:none;
}

.preview{
    display:none;
    width:100%;
    max-height:350px;
    object-fit:cover;
    border-radius:13px;
    margin-top:12px;
}

/* POST */

.post-head{
    display:flex;
    gap:10px;
    align-items:center;
}

.post-avatar{
    width:45px;
    height:45px;
    object-fit:cover;
    border-radius:50%;
}

.post-user{
    font-weight:800;
    font-size:14px;
}

.post-user span{
    color:var(--muted);
    font-weight:400;
}

.post-date{
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
}

.post-text{
    margin-top:14px;
    line-height:1.6;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.post-image{
    width:100%;
    max-height:600px;
    object-fit:cover;
    border-radius:14px;
    margin-top:13px;
}

.actions{
    display:flex;
    align-items:center;
    gap:5px;
    border-top:1px solid var(--border);
    margin-top:14px;
    padding-top:10px;
}

.action{
    border:0;
    background:transparent;
    color:var(--text);
    padding:8px 10px;
    border-radius:9px;
}

.action:hover{
    background:var(--hover);
}

.liked{
    color:var(--danger);
}

.delete{
    margin-left:auto;
}

/* COMMENTS */

.comments{
    margin-top:10px;
    border-top:1px solid var(--border);
    padding-top:10px;
}

.comment{
    display:flex;
    gap:8px;
    margin-bottom:9px;
}

.comment img{
    width:32px;
    height:32px;
    border-radius:50%;
    object-fit:cover;
}

.comment-body{
    background:var(--bg);
    padding:7px 10px;
    border-radius:10px;
    flex:1;
    font-size:13px;
}

.comment-body strong{
    display:block;
    margin-bottom:2px;
}

.comment-form{
    display:flex;
    gap:7px;
    margin-top:9px;
}

.comment-form input{
    flex:1;
    padding:9px 11px;
}

.comment-form button{
    border:0;
    background:var(--primary);
    color:#fff;
    border-radius:9px;
    padding:0 14px;
}

/* RIGHT */

.right-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    position:sticky;
    top:85px;
}

.right-title{
    font-weight:800;
    margin-bottom:15px;
}

.user-row{
    display:flex;
    align-items:center;
    gap:9px;
    margin-bottom:14px;
}

.user-row img{
    width:40px;
    height:40px;
    border-radius:50%;
    object-fit:cover;
}

.user-info{
    flex:1;
    min-width:0;
}

.user-info strong{
    display:block;
    font-size:13px;
}

.user-info span{
    color:var(--muted);
    font-size:11px;
}

.follow-btn{
    border:1px solid var(--primary);
    color:var(--primary);
    background:transparent;
    padding:6px 9px;
    border-radius:8px;
    font-size:11px;
    font-weight:700;
}

.follow-btn.following{
    background:var(--primary);
    color:white;
}

/* EXPLORE */

.page-title{
    font-size:22px;
    font-weight:900;
    margin-bottom:15px;
}

.empty{
    text-align:center;
    padding:50px 15px;
    color:var(--muted);
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#0009;
    z-index:500;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:450px;
    max-height:90vh;
    overflow:auto;
    background:var(--card);
    border-radius:20px;
    padding:24px;
}

.modal-title{
    font-size:21px;
    font-weight:900;
    margin-bottom:18px;
}

.modal-buttons{
    display:flex;
    gap:9px;
    margin-top:18px;
}

.modal-buttons button{
    flex:1;
}

.cancel{
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--border);
}

/* NOTIFICATION */

.notification{
    padding:12px;
    border-bottom:1px solid var(--border);
    font-size:13px;
}

.notification:last-child{
    border-bottom:0;
}

.notification small{
    color:var(--muted);
    display:block;
    margin-top:3px;
}

/* MOBILE */

@media(max-width:1000px){

    .container{
        grid-template-columns:220px minmax(0,650px);
        justify-content:center;
    }

    .right-sidebar{
        display:none;
    }
}

@media(max-width:700px){

    header{
        height:58px;
    }

    .header-inner{
        gap:8px;
    }

    .search{
        display:none;
    }

    .container{
        display:block;
        max-width:650px;
        margin:12px auto;
    }

    .sidebar{
        position:static;
    }

    .profile-card{
        margin-bottom:12px;
    }

    .nav{
        display:flex;
        overflow:auto;
    }

    .nav button{
        white-space:nowrap;
        width:auto;
    }
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->

<section id="auth" class="auth">

<div class="auth-box">

    <div class="auth-logo">Vynza</div>

    <div class="auth-sub">
        Paylaş. Keşfet. Bağlan.
    </div>

    <div class="auth-tabs">

        <button
            id="loginTab"
            class="active"
            onclick="showAuth('login')">
            Giriş Yap
        </button>

        <button
            id="registerTab"
            onclick="showAuth('register')">
            Kayıt Ol
        </button>

    </div>

    <div id="authError" class="error"></div>

    <!-- LOGIN -->

    <div id="loginForm">

        <div class="form-group">

            <label>Kullanıcı adı</label>

            <input
                id="loginUsername"
                type="text"
                placeholder="kullaniciadi">

        </div>

        <div class="form-group">

            <label>Şifre</label>

            <input
                id="loginPassword"
                type="password"
                placeholder="••••••••">

        </div>

        <button
            class="primary-btn"
            onclick="login()">
            Giriş Yap
        </button>

    </div>


    <!-- REGISTER -->

    <div id="registerForm" style="display:none">

        <div class="form-group">

            <label>Adın</label>

            <input
                id="registerName"
                type="text"
                maxlength="30"
                placeholder="Eren">

        </div>

        <div class="form-group">

            <label>Kullanıcı adı</label>

            <input
                id="registerUsername"
                type="text"
                maxlength="20"
                placeholder="eren123">

        </div>

        <div class="form-group">

            <label>Şifre</label>

            <input
                id="registerPassword"
                type="password"
                placeholder="En az 4 karakter">

        </div>

        <button
            class="primary-btn"
            onclick="register()">
            Hesap Oluştur
        </button>

    </div>

</div>

</section>


<!-- ================= APP ================= -->

<div id="app">

<header>

<div class="header-inner">

    <div class="logo">
        Vynza
    </div>

    <div class="search">

        <input
            id="searchInput"
            type="text"
            placeholder="Kullanıcı ara..."
            oninput="searchUsers()">

        <div
            id="searchResults"
            class="search-results">
        </div>

    </div>

    <div class="header-actions">

        <button
            class="icon-btn"
            onclick="showPage('notifications')"
            title="Bildirimler">
            🔔
        </button>

        <button
            class="icon-btn"
            onclick="toggleDark()"
            id="themeButton">
            🌙
        </button>

        <button
            class="icon-btn"
            onclick="logout()"
            title="Çıkış">
            🚪
        </button>

    </div>

</div>

</header>


<div class="container">

<!-- LEFT -->

<aside class="sidebar">

<div class="profile-card">

    <img
        id="myAvatar"
        class="avatar"
        src="https://via.placeholder.com/200">

    <div
        id="myName"
        class="profile-name">
    </div>

    <div
        id="myUsername"
        class="profile-username">
    </div>

    <div
        id="myBio"
        class="bio">
    </div>

    <div class="stats">

        <div class="stat">
            <strong id="myPosts">0</strong>
            <span>Gönderi</span>
        </div>

        <div class="stat">
            <strong id="myFollowers">0</strong>
            <span>Takipçi</span>
        </div>

        <div class="stat">
            <strong id="myFollowing">0</strong>
            <span>Takip</span>
        </div>

    </div>

    <button
        class="btn full"
        onclick="openProfile()">
        ✏️ Profili Düzenle
    </button>

</div>


<div class="nav">

    <button
        class="active"
        id="navHome"
        onclick="showPage('home')">
        🏠 Ana Sayfa
    </button>

    <button
        id="navExplore"
        onclick="showPage('explore')">
        🔎 Keşfet
    </button>

    <button
        id="navNotifications"
        onclick="showPage('notifications')">
        🔔 Bildirimler
    </button>

</div>

</aside>


<!-- CENTER -->

<main id="mainContent"></main>


<!-- RIGHT -->

<aside class="right-sidebar">

<div class="right-card">

    <div class="right-title">
        👥 Kullanıcılar
    </div>

    <div id="suggestions"></div>

</div>

</aside>

</div>

</div>


<!-- ================= PROFILE MODAL ================= -->

<div
    id="profileModal"
    class="modal">

<div class="modal-box">

    <div class="modal-title">
        Profilini Düzenle
    </div>

    <div class="form-group">

        <label>Ad</label>

        <input
            id="editName"
            type="text"
            maxlength="30">

    </div>

    <div class="form-group">

        <label>Biyografi</label>

        <textarea
            id="editBio"
            maxlength="150"></textarea>

    </div>

    <div class="form-group">

        <label>Profil fotoğrafı</label>

        <input
            id="editAvatar"
            type="file"
            accept="image/*"
            onchange="selectAvatar(event)">

    </div>

    <div class="modal-buttons">

        <button
            class="btn cancel"
            onclick="closeProfile()">
            Vazgeç
        </button>

        <button
            class="btn"
            onclick="saveProfile()">
            Kaydet
        </button>

    </div>

</div>

</div>


<script>

/* =========================================
   STORAGE
========================================= */

const USERS_KEY = "vynza_users";
const POSTS_KEY = "vynza_posts";
const CURRENT_KEY = "vynza_current";
const NOTIFICATIONS_KEY = "vynza_notifications";

let users =
    JSON.parse(localStorage.getItem(USERS_KEY)) || [];

let posts =
    JSON.parse(localStorage.getItem(POSTS_KEY)) || [];

let notifications =
    JSON.parse(localStorage.getItem(NOTIFICATIONS_KEY)) || [];

let currentUserId =
    localStorage.getItem(CURRENT_KEY);

let selectedAvatar = null;


/* =========================================
   DEFAULT ACCOUNT
========================================= */

if(users.length === 0){

    users.push({

        id:Date.now(),

        name:"Demo Kullanıcı",

        username:"demo",

        password:"1234",

        bio:"Vynza'ya hoş geldin! 🚀",

        avatar:"https://via.placeholder.com/200",

        followers:[],

        following:[]

    });

    saveUsers();

}


/* =========================================
   AUTH
========================================= */

function showAuth(type){

    document.getElementById("loginForm")
        .style.display =
        type === "login"
        ? "block"
        : "none";

    document.getElementById("registerForm")
        .style.display =
        type === "register"
        ? "block"
        : "none";

    document.getElementById("loginTab")
        .classList.toggle(
            "active",
            type === "login"
        );

    document.getElementById("registerTab")
        .classList.toggle(
            "active",
            type === "register"
        );

    hideError();
}


function showError(message){

    const error =
        document.getElementById("authError");

    error.textContent = message;

    error.style.display = "block";
}


function hideError(){

    document.getElementById("authError")
        .style.display = "none";
}


/* REGISTER */

function register(){

    hideError();

    const name =
        document.getElementById("registerName")
        .value.trim();

    const username =
        document.getElementById("registerUsername")
        .value.trim()
        .toLowerCase();

    const password =
        document.getElementById("registerPassword")
        .value;


    if(name.length < 2){

        showError("Ad en az 2 karakter olmalı.");

        return;
    }

    if(!/^[a-z0-9_]+$/i.test(username)){

        showError(
            "Kullanıcı adı sadece harf, sayı ve _ içerebilir."
        );

        return;
    }

    if(username.length < 3){

        showError(
            "Kullanıcı adı en az 3 karakter olmalı."
        );

        return;
    }

    if(password.length < 4){

        showError(
            "Şifre en az 4 karakter olmalı."
        );

        return;
    }

    if(
        users.some(
            user => user.username === username
        )
    ){

        showError(
            "Bu kullanıcı adı zaten alınmış."
        );

        return;
    }


    const newUser = {

        id:Date.now(),

        name:name,

        username:username,

        password:password,

        bio:"Vynza kullanıcısı 👋",

        avatar:"https://via.placeholder.com/200",

        followers:[],

        following:[]

    };


    users.push(newUser);

    saveUsers();

    currentUserId =
        newUser.id;

    localStorage.setItem(
        CURRENT_KEY,
        currentUserId
    );

    openApp();

}


/* LOGIN */

function login(){

    hideError();

    const username =
        document.getElementById("loginUsername")
        .value.trim()
        .toLowerCase();

    const password =
        document.getElementById("loginPassword")
        .value;


    const user =
        users.find(
            item =>
                item.username === username
                &&
                item.password === password
        );


    if(!user){

        showError(
            "Kullanıcı adı veya şifre yanlış."
        );

        return;
    }


    currentUserId = user.id;

    localStorage.setItem(
        CURRENT_KEY,
        currentUserId
    );

    openApp();

}


/* LOGOUT */

function logout(){

    currentUserId = null;

    localStorage.removeItem(
        CURRENT_KEY
    );

    document.getElementById("app")
        .style.display = "none";

    document.getElementById("auth")
        .style.display = "flex";

}


/* =========================================
   CURRENT USER
========================================= */

function currentUser(){

    return users.find(
        user =>
            String(user.id)
            ===
            String(currentUserId)
    );
}


/* =========================================
   STORAGE FUNCTIONS
========================================= */

function saveUsers(){

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
    );
}

function savePosts(){

    localStorage.setItem(
        POSTS_KEY,
        JSON.stringify(posts)
    );
}

function saveNotifications(){

    localStorage.setItem(
        NOTIFICATIONS_KEY,
        JSON.stringify(notifications)
    );
}


/* =========================================
   OPEN APP
========================================= */

function openApp(){

    const user = currentUser();

    if(!user){

        logout();

        return;
    }

    document.getElementById("auth")
        .style.display = "none";

    document.getElementById("app")
        .style.display = "block";

    updateSidebar();

    showPage("home");

    renderSuggestions();

}


/* =========================================
   SIDEBAR
========================================= */

function updateSidebar(){

    const user = currentUser();

    if(!user) return;


    document.getElementById("myAvatar")
        .src = safeImage(user.avatar);

    document.getElementById("myName")
        .textContent = user.name;

    document.getElementById("myUsername")
        .textContent =
        "@" + user.username;

    document.getElementById("myBio")
        .textContent = user.bio;

    document.getElementById("myFollowers")
        .textContent =
        user.followers.length;

    document.getElementById("myFollowing")
        .textContent =
        user.following.length;

    document.getElementById("myPosts")
        .textContent =
        posts.filter(
            post =>
                post.userId === user.id
        ).length;

}


/* =========================================
   PAGES
========================================= */

function showPage(page){

    document
        .querySelectorAll(".nav button")
        .forEach(
            btn =>
                btn.classList.remove("active")
        );

    if(page === "home"){

        document.getElementById("navHome")
            .classList.add("active");

        renderHome();

    }

    else if(page === "explore"){

        document.getElementById("navExplore")
            .classList.add("active");

        renderExplore();

    }

    else if(page === "notifications"){

        document
            .getElementById("navNotifications")
            .classList.add("active");

        renderNotifications();

    }

}


/* =========================================
   HOME
========================================= */

function renderHome(){

    const main =
        document.getElementById("mainContent");

    main.innerHTML = `

        <div class="card">

            <div class="create-title">
                Yeni gönderi
            </div>

            <textarea
                id="postText"
                maxlength="2000"
                placeholder="Ne düşünüyorsun?"></textarea>

            <img
                id="postPreview"
                class="preview">

            <div class="create-bottom">

                <label class="image-label">

                    🖼️ Fotoğraf

                    <input
                        type="file"
                        accept="image/*"
                        onchange="selectPostImage(event)">

                </label>

                <button
                    class="btn"
                    onclick="createPost()">
                    🚀 Paylaş
                </button>

            </div>

        </div>

        <div id="feed"></div>
    `;

    renderFeed(posts);

}


/* =========================================
   CREATE POST
========================================= */

let selectedPostImage = null;


function selectPostImage(event){

    const file =
        event.target.files[0];

    if(!file) return;

    if(file.size > 8 * 1024 * 1024){

        alert(
            "Fotoğraf 8 MB'dan küçük olmalı."
        );

        return;
    }


    const reader =
        new FileReader();

    reader.onload = function(e){

        selectedPostImage =
            e.target.result;

        const preview =
            document.getElementById(
                "postPreview"
            );

        preview.src =
            selectedPostImage;

        preview.style.display =
            "block";

    };

    reader.readAsDataURL(file);

}


/* CREATE */

function createPost(){

    const user = currentUser();

    if(!user) return;


    const text =
        document.getElementById("postText")
        .value
        .trim();


    if(!text && !selectedPostImage){

        alert(
            "Bir yazı veya fotoğraf eklemelisin."
        );

        return;
    }


    posts.unshift({

        id:Date.now(),

        userId:user.id,

        text:text,

        image:selectedPostImage,

        likes:[],

        comments:[],

        date:new Date()
            .toLocaleString("tr-TR")

    });


    savePosts();

    selectedPostImage = null;

    updateSidebar();

    renderHome();

}


/* =========================================
   FEED
========================================= */

function renderFeed(list){

    const feed =
        document.getElementById("feed");

    if(!feed) return;

    feed.innerHTML = "";


    if(list.length === 0){

        feed.innerHTML = `

            <div class="card empty">

                <div style="font-size:45px">
                    📭
                </div>

                <h3 style="margin-top:10px">
                    Henüz gönderi yok
                </h3>

                <p style="margin-top:6px">
                    İlk gönderiyi sen paylaş!
                </p>

            </div>

        `;

        return;
    }


    list.forEach(
        post =>
            feed.appendChild(
                createPostElement(post)
            )
    );

}


/* =========================================
   POST ELEMENT
========================================= */

function createPostElement(post){

    const user =
        users.find(
            item =>
                item.id === post.userId
        );

    if(!user) return document.createElement("div");


    const current =
        currentUser();


    const div =
        document.createElement("div");

    div.className = "card";


    const liked =
        post.likes.includes(
            current.id
        );


    div.innerHTML = `

        <div class="post-head">

            <img
                class="post-avatar"
                src="${safeImage(user.avatar)}">

            <div>

                <div class="post-user">

                    ${escapeHTML(user.name)}

                    <span>
                        @${escapeHTML(user.username)}
                    </span>

                </div>

                <div class="post-date">
                    ${escapeHTML(post.date)}
                </div>

            </div>

        </div>


        ${
            post.text
            ?
            `
            <div class="post-text">
                ${escapeHTML(post.text)}
            </div>
            `
            :
            ""
        }


        ${
            post.image
            ?
            `
            <img
                class="post-image"
                src="${safeImage(post.image)}">
            `
            :
            ""
        }


        <div class="actions">

            <button
                class="action ${liked ? "liked" : ""}"
                onclick="toggleLike(${post.id})">

                ${liked ? "❤️" : "🤍"}
                ${post.likes.length}

            </button>


            <button
                class="action"
                onclick="focusComment(${post.id})">

                💬 ${post.comments.length}

            </button>


            ${
                post.userId === current.id
                ?
                `
                <button
                    class="action delete"
                    onclick="deletePost(${post.id})">

                    🗑️ Sil

                </button>
                `
                :
                ""
            }

        </div>


        <div class="comments">

            ${renderComments(post)}

            <div class="comment-form">

                <input
                    id="comment-${post.id}"
                    placeholder="Yorum yaz...">

                <button
                    onclick="addComment(${post.id})">
                    Gönder
                </button>

            </div>

        </div>

    `;


    return div;

}


/* =========================================
   COMMENTS
========================================= */

function renderComments(post){

    if(post.comments.length === 0){

        return `
            <div style="
                color:var(--muted);
                font-size:12px;
                padding:4px;
            ">
                Henüz yorum yok.
            </div>
        `;

    }


    return post.comments
        .slice(-5)
        .map(comment => {

            const user =
                users.find(
                    item =>
                        item.id === comment.userId
                );

            if(!user) return "";

            return `

                <div class="comment">

                    <img
                        src="${safeImage(user.avatar)}">

                    <div class="comment-body">

                        <strong>
                            ${escapeHTML(user.name)}
                        </strong>

                        ${escapeHTML(comment.text)}

                    </div>

                </div>

            `;

        })
        .join("");

}


/* ADD COMMENT */

function addComment(postId){

    const input =
        document.getElementById(
            "comment-" + postId
        );

    if(!input) return;


    const text =
        input.value.trim();

    if(!text) return;


    const post =
        posts.find(
            item =>
                item.id === postId
        );

    if(!post) return;


    const user =
        currentUser();


    post.comments.push({

        id:Date.now(),

        userId:user.id,

        text:text,

        date:new Date()
            .toLocaleString("tr-TR")

    });


    if(post.userId !== user.id){

        addNotification(

            post.userId,

            user.id,

            "gönderine yorum yaptı."

        );

    }


    savePosts();

    renderHome();

}


/* =========================================
   LIKE
========================================= */

function toggleLike(postId){

    const post =
        posts.find(
            item =>
                item.id === postId
        );

    const user =
        currentUser();

    if(!post || !user) return;


    const index =
        post.likes.indexOf(
            user.id
        );


    if(index >= 0){

        post.likes.splice(
            index,
            1
        );

    }else{

        post.likes.push(
            user.id
        );


        if(post.userId !== user.id){

            addNotification(

                post.userId,

                user.id,

                "gönderini beğendi."

            );

        }

    }


    savePosts();

    renderHome();

}


/* =========================================
   DELETE POST
========================================= */

function deletePost(postId){

    const user =
        currentUser();


    const post =
        posts.find(
            item =>
                item.id === postId
        );


    if(!post || post.userId !== user.id)
        return;


    if(
        !confirm(
            "Bu gönderiyi silmek istiyor musun?"
        )
    )
        return;


    posts =
        posts.filter(
            item =>
                item.id !== postId
        );


    savePosts();

    updateSidebar();

    renderHome();

}


/* =========================================
   EXPLORE
========================================= */

function renderExplore(){

    const main =
        document.getElementById(
            "mainContent"
        );


    const sorted =
        [...posts]
        .sort(
            (a,b) =>
                b.likes.length
                -
                a.likes.length
        );


    main.innerHTML = `

        <div class="page-title">
            🔎 Keşfet
        </div>

        <div id="feed"></div>

    `;


    renderFeed(sorted);

}


/* =========================================
   SUGGESTIONS
========================================= */

function renderSuggestions(){

    const box =
        document.getElementById(
            "suggestions"
        );

    if(!box) return;


    const current =
        currentUser();


    const otherUsers =
        users
        .filter(
            user =>
                user.id !== current.id
        )
        .slice(0,5);


    if(otherUsers.length === 0){

        box.innerHTML = `
            <div class="empty">
                Henüz başka kullanıcı yok.
            </div>
        `;

        return;

    }


    box.innerHTML =
        otherUsers
        .map(
            user =>
                userRowHTML(user)
        )
        .join("");

}


/* USER ROW */

function userRowHTML(user){

    const current =
        currentUser();


    const following =
        current.following.includes(
            user.id
        );


    return `

        <div class="user-row">

            <img
                src="${safeImage(user.avatar)}">

            <div class="user-info">

                <strong>
                    ${escapeHTML(user.name)}
                </strong>

                <span>
                    @${escapeHTML(user.username)}
                </span>

            </div>

            <button
                class="follow-btn
                ${following ? "following" : ""}"
                onclick="toggleFollow(${user.id})">

                ${following
                    ? "Takipte"
                    : "Takip Et"}

            </button>

        </div>

    `;

}


/* =========================================
   FOLLOW
========================================= */

function toggleFollow(userId){

    const current =
        currentUser();

    const target =
        users.find(
            user =>
                user.id === userId
        );


    if(!current || !target)
        return;


    const index =
        current.following.indexOf(
            userId
        );


    if(index >= 0){

        current.following.splice(
            index,
            1
        );

        const targetIndex =
            target.followers.indexOf(
                current.id
            );

        if(targetIndex >= 0){

            target.followers.splice(
                targetIndex,
                1
            );

        }

    }else{

        current.following.push(
            userId
        );

        target.followers.push(
            current.id
        );


        addNotification(

            target.id,

            current.id,

            "seni takip etmeye başladı."

        );

    }


    saveUsers();

    updateSidebar();

    renderSuggestions();

}


/* =========================================
   NOTIFICATIONS
========================================= */

function addNotification(
    receiverId,
    senderId,
    text
){

    notifications.unshift({

        id:Date.now(),

        receiverId:receiverId,

        senderId:senderId,

        text:text,

        date:new Date()
            .toLocaleString("tr-TR")

    });


    saveNotifications();

}


function renderNotifications(){

    const main =
        document.getElementById(
            "mainContent"
        );

    const user =
        currentUser();


    const list =
        notifications.filter(
            item =>
                item.receiverId === user.id
        );


    main.innerHTML = `

        <div class="card">

            <div class="page-title">
                🔔 Bildirimler
            </div>

            ${
                list.length === 0
                ?
                `
                <div class="empty">
                    Henüz bildirimin yok.
                </div>
                `
                :
                list
                .map(
                    notification => {

                        const sender =
                            users.find(
                                item =>
                                    item.id ===
                                    notification.senderId
                            );

                        if(!sender)
                            return "";

                        return `

                            <div class="notification">

                                <strong>
                                    ${escapeHTML(sender.name)}
                                </strong>

                                ${escapeHTML(
                                    notification.text
                                )}

                                <small>
                                    ${escapeHTML(
                                        notification.date
                                    )}
                                </small>

                            </div>

                        `;

                    }
                )
                .join("")
            }

        </div>

    `;

}


/* =========================================
   SEARCH
========================================= */

function searchUsers(){

    const input =
        document.getElementById(
            "searchInput"
        );

    const results =
        document.getElementById(
            "searchResults"
        );


    const query =
        input.value
        .trim()
        .toLowerCase();


    if(!query){

        results.style.display =
            "none";

        return;

    }


    const matches =
        users.filter(
            user =>
                user.username
                    .toLowerCase()
                    .includes(query)
                ||
                user.name
                    .toLowerCase()
                    .includes(query)
        )
        .slice(0,6);


    if(matches.length === 0){

        results.innerHTML = `
            <div style="
                padding:12px;
                color:var(--muted);
                font-size:13px;
            ">
                Kullanıcı bulunamadı.
            </div>
        `;

    }else{

        results.innerHTML =
            matches
            .map(
                user => `

                    <div
                        class="search-user"
                        onclick="openUserProfile(${user.id})">

                        <img
                            src="${safeImage(user.avatar)}">

                        <div>

                            <strong>
                                ${escapeHTML(user.name)}
                            </strong>

                            <div style="
                                color:var(--muted);
                                font-size:11px;
                            ">
                                @${escapeHTML(user.username)}
                            </div>

                        </div>

                    </div>

                `
            )
            .join("");

    }


    results.style.display =
        "block";

}


/* =========================================
   USER PROFILE
========================================= */

function openUserProfile(userId){

    const user =
        users.find(
            item =>
                item.id === userId
        );


    if(!user) return;


    const current =
        currentUser();


    const following =
        current.following.includes(
            user.id
        );


    const userPosts =
        posts.filter(
            post =>
                post.userId === user.id
        );


    const main =
        document.getElementById(
            "mainContent"
        );


    main.innerHTML = `

        <div class="card"
             style="text-align:center">

            <img
                class="avatar"
                src="${safeImage(user.avatar)}">

            <div class="profile-name">
                ${escapeHTML(user.name)}
            </div>

            <div class="profile-username">
                @${escapeHTML(user.username)}
            </div>

            <div class="bio">
                ${escapeHTML(user.bio)}
            </div>

            <div class="stats">

                <div class="stat">

                    <strong>
                        ${userPosts.length}
                    </strong>

                    <span>
                        Gönderi
                    </span>

                </div>

                <div class="stat">

                    <strong>
                        ${user.followers.length}
                    </strong>

                    <span>
                        Takipçi
                    </span>

                </div>

                <div class="stat">

                    <strong>
                        ${user.following.length}
                    </strong>

                    <span>
                        Takip
                    </span>

                </div>

            </div>

            <button
                class="btn"
                onclick="toggleFollow(${user.id})">

                ${following
                    ? "Takibi Bırak"
                    : "Takip Et"}

            </button>

        </div>

        <div id="feed"></div>

    `;


    renderFeed(userPosts);

}


/* =========================================
   PROFILE MODAL
========================================= */

function openProfile(){

    const user =
        currentUser();


    document.getElementById(
        "editName"
    ).value = user.name;


    document.getElementById(
        "editBio"
    ).value = user.bio;


    document.getElementById(
        "profileModal"
    ).classList.add("show");

}


function closeProfile(){

    document.getElementById(
        "profileModal"
    ).classList.remove("show");

}


function selectAvatar(event){

    const file =
        event.target.files[0];

    if(!file) return;


    if(file.size > 5 * 1024 * 1024){

        alert(
            "Profil fotoğrafı 5 MB'dan küçük olmalı."
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            selectedAvatar =
                e.target.result;

        };


    reader.readAsDataURL(file);

}


function saveProfile(){

    const user =
        currentUser();


    const name =
        document.getElementById(
            "editName"
        ).value.trim();


    const bio =
        document.getElementById(
            "editBio"
        ).value.trim();


    if(!name){

        alert(
            "Ad boş bırakılamaz."
        );

        return;

    }


    user.name =
        name;

    user.bio =
        bio ||
        "Vynza kullanıcısı 👋";


    if(selectedAvatar){

        user.avatar =
            selectedAvatar;

    }


    saveUsers();

    selectedAvatar = null;

    closeProfile();

    updateSidebar();

    showPage("home");

}


/* =========================================
   FOCUS COMMENT
========================================= */

function focusComment(postId){

    const input =
        document.getElementById(
            "comment-" + postId
        );

    if(input){

        input.focus();

        input.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

    }

}


/* =========================================
   DARK MODE
========================================= */

function toggleDark(){

    document.body
        .classList
        .toggle("dark");


    const dark =
        document.body
        .classList
        .contains("dark");


    localStorage.setItem(
        "vynza_dark",
        dark
    );


    document.getElementById(
        "themeButton"
    ).textContent =
        dark ? "☀️" : "🌙";

}


/* =========================================
   SECURITY
========================================= */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


function safeImage(src){

    if(
        typeof src !== "string"
        ||
        (
            !src.startsWith("data:image/")
            &&
            !src.startsWith("https://")
        )
    ){

        return "https://via.placeholder.com/200";

    }


    return src;

}


/* =========================================
   CLOSE SEARCH
========================================= */

document.addEventListener(
    "click",
    function(event){

        const search =
            document.querySelector(".search");

        if(
            search
            &&
            !search.contains(event.target)
        ){

            const results =
                document.getElementById(
                    "searchResults"
                );

            if(results){

                results.style.display =
                    "none";

            }

        }

    }
);


/* =========================================
   DARK START
========================================= */

if(
    localStorage.getItem("vynza_dark")
    ===
    "true"
){

    document.body
        .classList
        .add("dark");

}


/* =========================================
   START
========================================= */

if(currentUserId){

    openApp();

}else{

    document.getElementById("auth")
        .style.display = "flex";

}

</script>

</body>
</html>
